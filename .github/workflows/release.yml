---
name: Release

on:
  push:
    tags:
      - "sec-forge-v*.*.*"
      - "mesh-router-v*.*.*"
      - "data-streams-producer-v*.*.*"
      - "data-streams-consumer-v*.*.*"
  workflow_dispatch:
    inputs:
      image:
        description: Image name (sec-forge, mesh-router, data-streams-producer, data-streams-consumer)
        required: true
        type: choice
        options:
          - sec-forge
          - mesh-router
          - data-streams-producer
          - data-streams-consumer
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  # Required because the quality job calls ci.yml, which declares
  # pull-requests: read for its path filter. A called workflow's token
  # permissions can only be downgraded by the caller, never elevated, so
  # granting less than the callee declares fails the whole run at startup
  # before any job exists.
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve image and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Parse release coordinates
        id: meta
        env:
          MANUAL_IMAGE: ${{ inputs.image }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="${MANUAL_IMAGE:-}"
          version="${MANUAL_VERSION:-}"

          if [[ -z "$image" || -z "$version" ]]; then
            ref="${GITHUB_REF_NAME}"
            if [[ "$ref" =~ ^(sec-forge|mesh-router|data-streams-producer|data-streams-consumer)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              image="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[2]}"
            else
              echo "Unable to parse image and version from ref: ${ref}" >&2
              exit 1
            fi
          fi

          case "$image" in
            sec-forge|mesh-router|data-streams-producer|data-streams-consumer) ;;
            *)
              echo "Unknown image: ${image}" >&2
              exit 1
              ;;
          esac

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release version: ${version}" >&2
            exit 1
          }

          file_version="$(tr -d '[:space:]' < "images/${image}/VERSION")"
          [[ "$file_version" == "$version" ]] || {
            echo "images/${image}/VERSION (${file_version}) does not match release version ${version}" >&2
            exit 1
          }

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${image}-v${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${image} at ${version}"

  quality:
    name: Quality gate
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      pull: true
      images: ${{ needs.resolve.outputs.image }}

  release:
    name: Publish multi-architecture release
    needs: [resolve, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: dockerhub
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish release manifests
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IMAGE_NAME: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          export CREATED
          CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker buildx bake -f docker-bake.hcl "release-${IMAGE_NAME}" --pull --push \
            --provenance=mode=max --sbom=true

      - name: Verify published tags and platforms
        run: >-
          bash scripts/verify-manifests.sh
          "${{ needs.resolve.outputs.image }}"
          "${{ needs.resolve.outputs.version }}"

      # verify-manifests checks metadata only: that both platforms exist and
      # that latest and the semver tag share a digest. It never runs the
      # artefact. The quality gate proved a locally built image, which is not
      # the same bytes as the pushed one. This pulls what users will actually
      # receive and runs the real smoke test against it, so a broken publish
      # fails the run rather than sitting undetected on Docker Hub.
      - name: Smoke test the published image
        env:
          IMAGE_NAME: ${{ needs.resolve.outputs.image }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          docker image rm "docker.io/cloudsprocket/${IMAGE_NAME}:${RELEASE_VERSION}" >/dev/null 2>&1 || true
          docker pull "docker.io/cloudsprocket/${IMAGE_NAME}:${RELEASE_VERSION}"
          bash scripts/smoke-test.sh "$IMAGE_NAME" "$RELEASE_VERSION"

      # Hub overviews must carry description, source, contributing and website
      # for Docker-Sponsored Open Source compliance. Only refresh after publish
      # and both post-push verification steps have passed, so a failed check
      # never updates a Hub page to describe a broken release.
      - name: Update Docker Hub repository metadata
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Repository settings need repo:admin, while pushing an image needs
          # only repo:write, so the push token returns "access denied:
          # insufficient scope" on the PATCH. Set DOCKERHUB_METADATA_TOKEN to
          # an admin-scoped token to keep the push path on a narrower one.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_METADATA_TOKEN || secrets.DOCKERHUB_TOKEN }}
        run: >-
          ./scripts/update-dockerhub-metadata.ps1
          -Apply
          -Image "${{ needs.resolve.outputs.image }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ${{ needs.resolve.outputs.image }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          repository="docker.io/cloudsprocket/${RELEASE_IMAGE}"
          {
            echo "## Published image"
            echo
            echo "- \`${repository}:${RELEASE_VERSION}\`"
            echo "- \`${repository}:latest\` (same multi-arch digest)"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "Source version file: \`images/${RELEASE_IMAGE}/VERSION\`"
          } > "$notes"
          verify_args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            verify_args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$notes" \
            "${verify_args[@]}"
