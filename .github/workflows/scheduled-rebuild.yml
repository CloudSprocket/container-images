---
name: Scheduled clean rebuild

on:
  schedule:
    - cron: "17 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # Must match or exceed what the called ci.yml declares. See release.yml.
  pull-requests: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      pull: true
      images: all
